TB.cajas = {
  t: 'cajas', pk: 'dia', f: fld('inicial::n retiros::j cierre::j?'),
  all: () => Object.entries(db.cajas),
  get: k => db.cajas[k],
  assign: (k, o) => { if (db.cajas[k]) Object.assign(db.cajas[k], o); else db.cajas[k] = o; },
  del: k => { delete db.cajas[k]; },
  // una caja que nadie tocó no hace falta guardarla
  vacia: o => !(o.retiros && o.retiros.length) && !o.cierre && o.inicial === (db.config.fondo ?? 20000),
};
const ORDEN = ['config', 'proveedores', 'clientes', 'productos', 'ventas', 'mov_clientes', 'compras', 'mov_proveedores', 'ajustes_stock', 'cajas'];

function aBase(ty, v) {
  switch (ty) {
    case 'n': return Number(v) || 0;
    case 'n?': return v == null || v === '' || isNaN(Number(v)) ? null : Number(v);
    case 't': return v ? new Date(v).toISOString() : new Date().toISOString();
    case 'd': return v || null;
    case 'j': return v == null ? [] : v;
    case 'j?': return v == null ? null : v;
    case 'b': return !!v;
    default: return v == null ? '' : String(v);
  }
}
function deBase(ty, v) {
  switch (ty) {
    case 'n': return v == null ? 0 : Number(v);
    case 'n?': return v == null ? null : Number(v);
    case 't': return v ? new Date(v).toISOString() : null;
    case 'd': return v ? String(v).slice(0, 10) : null;
    case 'j': return v == null ? [] : v;
    case 'j?': return v == null ? null : v;
    case 'b': return !!v;
    default: return v == null ? '' : String(v);
  }
}
function toRow(sp, k, o) {
  if (sp.toRow) return sp.toRow(k, o);
  const r = { [sp.pk]: k };
  sp.f.forEach(([a, c, ty]) => { r[c] = aBase(ty, o[a]); });
  return r;
}
function fromRow(sp, r) {
  if (sp.fromRow) return sp.fromRow(r);
  const k = sp.pk === 'id' ? Number(r.id) : String(r[sp.pk]).slice(0, 10), o = {};
  if (sp.pk === 'id') o.id = k;
  sp.f.forEach(([a, c, ty]) => { o[a] = deBase(ty, r[c]); });
  return { k, o };
}
const firmaDe = (sp, row, o) => sp.firma ? sp.firma(o) : JSON.stringify(row);

/* ---------- Copia de lo que hay en la base (para saber qué cambió) ---------- */
let SNAP = {};
const copia = v => JSON.parse(JSON.stringify(v));
function setSnap(t, k, row) { const sp = TB[t], j = JSON.stringify(row); SNAP[t].set(k, { r: JSON.parse(j), s: sp.firma ? sp.firma(row) : j }); }

/* Lista de cambios hechos en este equipo que todavía no están en la base */
function cambiosLocales() {
  const out = [];
  for (const t of ORDEN) {
    const sp = TB[t], snap = SNAP[t], vistos = new Set();
    for (const [k, o] of sp.all()) {
      vistos.add(k);
      const old = snap.get(k);
      if (!old) { if (sp.vacia && sp.vacia(o)) continue; out.push({ t, k, row: copia(toRow(sp, k, o)), snap: null }); continue; }
      if (sp.firma) { if (sp.firma(o) !== old.s) out.push({ t, k, row: copia(toRow(sp, k, o)), snap: old.r }); continue; }
      const j = JSON.stringify(toRow(sp, k, o));
      if (j !== old.s) out.push({ t, k, row: JSON.parse(j), snap: old.r });
    }
    for (const k of snap.keys()) if (!vistos.has(k)) out.push({ t, k, del: true });
  }
  return out;
}

/* Junta un cambio de otro equipo con lo que se está tocando acá.
   Gana lo local en los campos que se cambiaron acá; el stock se suma (no se pisa). */
function fusionar(t, local, base, remoto) {
  const out = { ...remoto };
  for (const c of Object.keys(remoto)) {
    if (c === TB[t].pk) continue;
    if (t === 'productos' && c === 'stock') { out.stock = r3(Number(remoto.stock) + Number(local.stock) - Number(base.stock)); continue; }
    if (JSON.stringify(local[c]) !== JSON.stringify(base[c])) out[c] = local[c];
  }
  return out;
}

/* ---------- Traer todo de la base ---------- */
async function traerTodo(t, pk, filtro) {
  const out = [];
  for (let desde = 0; ;) {
    let q = sb.from(t).select('*');
    if (filtro) q = filtro(q);
    const { data, error } = await q.order(pk, { ascending: true }).range(desde, desde + 999);
    if (error) throw error;
    if (!data || !data.length) break;
    out.push(...data); desde += data.length;
    if (data.length < 50) break;
  }
  return out;
}
async function cargarTodo() {
  const desde = addDays(sod(new Date()), -DIAS_HISTORIAL), dDesde = dayKey(desde);
  const filtros = { ventas: q => q.gte('fecha', desde.toISOString()), ajustes_stock: q => q.gte('fecha', desde.toISOString()), cajas: q => q.gte('dia', dDesde) };
  const [datos, ult] = await Promise.all([
    Promise.all(ORDEN.map(t => traerTodo(t, TB[t].pk, filtros[t]))),
    sb.from('ventas').select('num').order('num', { ascending: false }).limit(1),
  ]);
  if (ult.error) throw ult.error;
  // Se arma todo nuevo y recién al final se reemplaza (así no se pierde nada de lo que se tocó mientras cargaba)
  const pend = db && SNAP.productos ? cambiosLocales() : leerPendientes();
  db = emptyDB(); db.cajas = {}; SNAP = {};
  ORDEN.forEach((t, i) => {
    const sp = TB[t]; SNAP[t] = new Map();
    datos[i].forEach(r => { const { k, o } = fromRow(sp, r); (sp.push || sp.assign)(k, o); setSnap(t, k, toRow(sp, k, o)); });
  });
  ['ventas', 'movCC', 'movProv', 'compras', 'ajustes'].forEach(c => db[c].sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0));
  maxNum = Math.max(maxNum, (ult.data && ult.data[0] && ult.data[0].num) || 0);
  aplicarPendientes(pend);
}
function aplicarPendientes(lista) {
  (lista || []).forEach(p => {
    const sp = TB[p.t]; if (!sp || !SNAP[p.t]) return;
    const cur = SNAP[p.t].get(p.k);
    if (p.del) { if (cur) sp.del(p.k); return; }
    if (!cur) { const { o } = fromRow(sp, p.row); sp.assign(p.k, o); return; }
    if (!p.snap) return; // ya había llegado a la base
    const { o } = fromRow(sp, fusionar(p.t, p.row, p.snap, cur.r));
    sp.assign(p.k, o);
  });
}

/* ---------- Pendientes guardados en el equipo (por si se corta internet o se cierra) ---------- */
function guardarPendientes(lista) {
  lista = lista || (db ? cambiosLocales() : []);
  try {
    if (!lista.length) localStorage.removeItem(PEND_KEY);
    else localStorage.setItem(PEND_KEY, JSON.stringify(lista));
  } catch (e) { /* sin lugar en el equipo: queda en memoria */ }
  return lista.length;
}
function leerPendientes() { try { return JSON.parse(localStorage.getItem(PEND_KEY) || '[]'); } catch (e) { return []; } }

/* ---------- Subir los cambios ---------- */
let enVuelo = false, otraVez = false, cola = [], reintento = null, espera = 4000, vueltas = 0;
function persist() { clearTimeout(persist.t); persist.t = setTimeout(subir, 250); estado('guardando'); }
function saveNow() { if (db && SNAP.productos) { guardarPendientes(); subir(); } }
let ultUid = 0;
function nextId() { let n = Date.now() * 1000 + Math.floor(Math.random() * 1000); if (n <= ultUid) n = ultUid + 1; ultUid = n; return n; }
function nextNum() { maxNum = Math.max(maxNum, db.ventas.reduce((m, v) => Math.max(m, v.num || 0), 0)) + 1; return maxNum; }

const esErrorDeDatos = e => /^(22|23)/.test((e && e.code) || '');
function textoError(e) {
  const c = (e && e.code) || '', m = (e && e.message) || String(e || '');
  if (c === '23505') return 'ya hay otro registro con el mismo código';
  if (c === '23502') return 'falta un dato obligatorio';
  if (c === '42P01' || c === 'PGRST205' || c === 'PGRST202' || c === 'PGRST204') return 'falta preparar la base. Corré el archivo supabase-sistema.sql en Supabase (SQL Editor)';
  if (/invalid api key|no api key|apikey/i.test(m)) return 'la clave de Supabase no es válida';
  if (/fetch|network|load failed|timeout/i.test(m)) return 'no hay conexión con internet';
  return m;
}

async function subir() {
  clearTimeout(persist.t); clearTimeout(reintento);
  if (!sb || !db || !SNAP.productos) return;
  if (enVuelo) { otraVez = true; return; }
  enVuelo = true; otraVez = false;
  let fallo = null;
  try {
    const lista = cambiosLocales();
    for (const t of ORDEN) await subirTabla(t, lista.filter(x => x.t === t));
    espera = 4000;
  } catch (e) { fallo = e; console.warn('Palmares: no se pudo subir, se reintenta', e && (e.code || ''), e && e.message); }
  enVuelo = false;
  const c = cola; cola = []; c.forEach(alCambiarRemoto);
  const n = guardarPendientes();
  if (fallo) {
    estado('offline', n);
    reintento = setTimeout(subir, espera); espera = Math.min(espera * 2, 60000);
    if (/42501|PGRST30/.test(fallo.code || '')) revisarSesion();
    return;
  }
  if ((otraVez || n) && vueltas < 3) { vueltas++; subir(); return; }
  vueltas = 0;
  estado(n ? 'offline' : 'ok', n);
  if (n) reintento = setTimeout(subir, espera);
}
async function subirTabla(t, lista) {
  if (!lista.length) return;
  const sp = TB[t], ins = [], upd = [], stock = [], del = [];
  lista.forEach(x => {
    if (x.del) { del.push(x.k); return; }
    if (!x.snap) { ins.push({ k: x.k, row: x.row, full: x.row }); return; }
    if (t === 'productos') {
      const d = r3(x.row.stock - x.snap.stock), r2 = { ...x.row }, s2 = { ...x.snap };
      delete r2.stock; delete s2.stock;
      if (JSON.stringify(r2) !== JSON.stringify(s2)) upd.push({ k: x.k, row: r2, full: { ...x.row, stock: x.snap.stock } });
      if (d) stock.push({ k: x.k, d });
    } else upd.push({ k: x.k, row: x.row, full: x.row });
  });
  if (ins.length) await mandar(t, ins);
  if (upd.length) await mandar(t, upd);
  if (stock.length) await mandarStock(stock);
  if (del.length) await borrar(t, del);
}
async function mandar(t, items) {
  const sp = TB[t];
  for (let i = 0; i < items.length; i += 400) {
    const lote = items.slice(i, i + 400);
    const { error } = await sb.from(t).upsert(lote.map(x => x.row), { onConflict: sp.pk });
    if (!error) { lote.forEach(x => setSnap(t, x.k, x.full)); continue; }
    if (!esErrorDeDatos(error)) throw error;
    for (const x of lote) { // se prueba de a uno para encontrar el que falla
      const r = await sb.from(t).upsert([x.row], { onConflict: sp.pk });
      if (!r.error) { setSnap(t, x.k, x.full); continue; }
      if (!esErrorDeDatos(r.error)) throw r.error;
      revertir(t, x.k, r.error);
    }
  }
}
async function mandarStock(items) {
  const { error } = await sb.rpc('sumar_stock', { cambios: items.map(x => ({ id: x.k, d: x.d })) });
  if (error) {
    if (!esErrorDeDatos(error)) throw error;
    items.forEach(x => { const p = TB.productos.get(x.k); if (p) p.stock = r3(p.stock - x.d); });
    toast('No se pudo actualizar el stock: ' + textoError(error), 'bad'); hayCambiosRemotos = true;
    return;
  }
  items.forEach(x => { const s = SNAP.productos.get(x.k); if (s) setSnap('productos', x.k, { ...s.r, stock: r3(Number(s.r.stock) + x.d) }); });
}
async function borrar(t, keys) {
  const sp = TB[t];
  const { error } = await sb.from(t).delete().in(sp.pk, keys);
  if (!error) { keys.forEach(k => SNAP[t].delete(k)); return; }
  if (!esErrorDeDatos(error)) throw error;
  keys.forEach(k => revertir(t, k, error));
}
function revertir(t, k, err) {
  const sp = TB[t], old = SNAP[t].get(k);
  if (old) sp.assign(k, fromRow(sp, old.r).o); else sp.del(k);
  toast('No se pudo guardar: ' + textoError(err), 'bad');
  hayCambiosRemotos = true;
}

/* ---------- Cambios que llegan de otros equipos ---------- */
let hayCambiosRemotos = false;
function alCambiarRemoto(ev) {
  if (!db || !SNAP.productos) return;
  if (enVuelo) { cola.push(ev); return; }
  const sp = TB[ev.table]; if (!sp) return;
  const snap = SNAP[ev.table];
  if (ev.eventType === 'DELETE') {
    const r = ev.old || {}; if (r[sp.pk] == null) return;
    const k = sp.pk === 'id' ? Number(r.id) : String(r[sp.pk]).slice(0, 10);
    const s = snap.get(k), local = sp.get(k);
    if (local && s && (sp.firma ? sp.firma(local) : JSON.stringify(toRow(sp, k, local))) !== s.s) { snap.delete(k); return; } // se estaba cambiando acá: se vuelve a guardar
    if (local) sp.del(k);
    snap.delete(k); hayCambiosRemotos = true;
    return;
  }
  const { k, o } = fromRow(sp, ev.new), remoto = toRow(sp, k, o);
  const s = snap.get(k), local = sp.get(k);
  if (!local || !s) sp.assign(k, o);
  else sp.assign(k, fromRow(sp, fusionar(ev.table, toRow(sp, k, local), s.r, remoto)).o);
  setSnap(ev.table, k, remoto);
  hayCambiosRemotos = true;
}
function puedeRedibujar() {
  if (modals.length || state.view === 'caja') return false;
  const a = document.activeElement;
  return !(a && a.closest && a.closest('#view') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
function suscribir() {
  if (canal) { try { sb.removeChannel(canal); } catch (e) { } }
  let caido = false;
  canal = sb.channel('palmares-cambios')
    .on('postgres_changes', { event: '*', schema: 'public' }, alCambiarRemoto)
    .subscribe(st => {
      if (st === 'SUBSCRIBED') { if (caido) { caido = false; recargar(); } }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT') caido = true;
    });
}
async function recargar() {
  if (!db) return;
  if (enVuelo || modals.length) { setTimeout(recargar, 4000); return; }
  try { await cargarTodo(); hayCambiosRemotos = true; if (cambiosLocales().length) subir(); }
  catch (e) { estado('offline', cambiosLocales().length); }
}
async function revisarSesion() {
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) puerta('login', 'Tu sesión se cerró. Entrá de nuevo: lo que no se subió queda guardado en este equipo.');
}

/* ---------- Estado de guardado (arriba a la derecha) ---------- */
function estado(k, n = 0) {
  const el = $('#sync'); if (!el) return;
  el.className = 'sync-chip ' + k;
  el.textContent = k === 'ok' ? 'Guardado' : k === 'guardando' ? 'Guardando…' : n ? `Sin conexión · ${n} sin subir` : 'Sin conexión';
  el.title = k === 'offline' ? 'Se sigue trabajando normal. Lo que se carga queda en este equipo y se sube solo cuando vuelve internet.' : 'Todo está guardado en la nube';
}

/* ---------- Pantalla de ingreso ---------- */
function puerta(modo, msg = '') {
  let g = $('#gate');
  if (!g) { g = document.createElement('div'); g.id = 'gate'; g.className = 'gate'; document.body.appendChild(g); }
  g.hidden = false;
  const c = conexion();
  const cuerpo = {
    cargando: `<p class="gate-load"><span class="spin"></span>${esc(msg || 'Conectando con la base de datos…')}</p>`,
    conexion: `<h1>Conectar el sistema</h1><p class="sub">Se hace una sola vez en cada equipo.</p>
      <form class="form" id="gt-form" novalidate>
        <div class="field"><label for="gt-url">Project URL de Supabase</label><input id="gt-url" value="${esc((c && c.url) || SUPABASE_URL)}" autocomplete="off" spellcheck="false"></div>
        <div class="field"><label for="gt-key">Clave publishable</label><input id="gt-key" placeholder="sb_publishable_…" autocomplete="off" spellcheck="false"><p class="hint">Está en Supabase › Project Settings › API Keys. Nunca uses la clave secret.</p></div>
        ${msg ? `<p class="err-msg">${esc(msg)}</p>` : ''}
        <button class="btn btn-primary btn-block" type="submit">Conectar</button>
      </form>`,
    login: `<h1>Ingresar</h1><p class="sub">Entrá con tu email y contraseña</p>
      <form class="form" id="gt-form" novalidate>
        <div class="field"><label for="gt-mail">Email</label><input id="gt-mail" type="email" autocomplete="username" inputmode="email" autocapitalize="off"></div>
        <div class="field"><label for="gt-pass">Contraseña</label><input id="gt-pass" type="password" autocomplete="current-password"></div>
        ${msg ? `<p class="err-msg" id="gt-err">${esc(msg)}</p>` : '<p class="err-msg" id="gt-err" hidden></p>'}
        <button class="btn btn-primary btn-block" type="submit" id="gt-ok">Entrar</button>
      </form>
      <button class="link gate-foot" id="gt-conn" type="button">Cambiar la conexión</button>`,
    sinpermiso: `<h1>Falta el permiso</h1><p class="sub">Tu usuario (${esc(msg)}) todavía no tiene permiso para usar el sistema. Pedile al dueño que te lo dé en Configuración › Usuarios.</p>
      <div class="form"><button class="btn btn-block" id="gt-reint" type="button">Ya me lo dieron, probar de nuevo</button><button class="btn btn-block" id="gt-out" type="button">Entrar con otro usuario</button></div>`,
    error: `<h1>No se pudo abrir</h1><p class="sub">${esc(msg)}</p><div class="form"><button class="btn btn-primary btn-block" id="gt-reint" type="button">Probar de nuevo</button><button class="link gate-foot" id="gt-conn" type="button">Cambiar la conexión</button></div>`,
  }[modo];
  g.innerHTML = `<div class="gate-card"><img src="${LOGO}" alt="Autoservicio Palmares" class="gate-logo">${cuerpo}</div>`;
  const q = id => g.querySelector('#' + id);
  if (modo === 'conexion') {
    setTimeout(() => q('gt-key').focus(), 30);
    q('gt-form').addEventListener('submit', async e => {
      e.preventDefault();
      const url = q('gt-url').value.trim().replace(/\/+$/, ''), key = q('gt-key').value.trim();
      if (!/^https:\/\/.+\.supabase\.co$/.test(url)) { fieldErr(g, 'gt-url', 'Tiene que ser como https://xxxx.supabase.co'); return; }
      if (!/^sb_publishable_|^eyJ/.test(key)) { fieldErr(g, 'gt-key', key.startsWith('sb_secret_') ? 'Esa es la clave secret: no se usa acá. Copiá la publishable.' : 'Pegá la clave publishable (empieza con sb_publishable_)'); return; }
      puerta('cargando', 'Probando la conexión…');
      try {
        const prueba = window.supabase.createClient(url, key, { auth: { persistSession: false } });
        const { error } = await prueba.from('productos').select('id', { head: true, count: 'exact' });
        if (error) throw error;
        guardarConexion(url, key); location.reload();
      } catch (er) { puerta('conexion', 'No se pudo conectar: ' + textoError(er)); }
    });
  }
  if (modo === 'login') {
    setTimeout(() => q('gt-mail').focus(), 30);
    q('gt-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email = q('gt-mail').value.trim(), password = q('gt-pass').value;
      if (!email) { fieldErr(g, 'gt-mail', 'Escribí tu email'); return; }
      if (!password) { fieldErr(g, 'gt-pass', 'Escribí tu contraseña'); return; }
      q('gt-ok').disabled = true; q('gt-ok').textContent = 'Entrando…';
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        q('gt-ok').disabled = false; q('gt-ok').textContent = 'Entrar';
        const er = q('gt-err'); er.hidden = false;
        er.textContent = /invalid login|credentials/i.test(error.message) ? 'El email o la contraseña no son correctos.' : 'No se pudo entrar: ' + textoError(error);
        return;
      }
      entrar(data.session);
    });
  }
  if (q('gt-conn')) q('gt-conn').addEventListener('click', () => { try { localStorage.removeItem(CONN_KEY); } catch (e) { } puerta('conexion'); });
  if (q('gt-reint')) q('gt-reint').addEventListener('click', () => location.reload());
  if (q('gt-out')) q('gt-out').addEventListener('click', async () => { await sb.auth.signOut(); puerta('login'); });
}
function cerrarPuerta() { const g = $('#gate'); if (g) g.hidden = true; }

/* ---------- Entrar al sistema ---------- */
async function entrar(ses) {
  puerta('cargando', 'Trayendo los datos del negocio…');
  try {
    const { data: perfil, error } = await sb.from('perfiles').select('*').eq('user_id', ses.user.id).maybeSingle();
    if (error) throw error;
    if (!perfil || !perfil.rol || !ROLES[perfil.rol]) { puerta('sinpermiso', ses.user.email || ''); return; }
    yo = { id: ses.user.id, email: ses.user.email, nombre: perfil.nombre || (ses.user.email || '').split('@')[0], rol: perfil.rol };
    state.role = perfil.rol;
    await cargarTodo();
    arrancar();
  } catch (e) { puerta('error', 'No se pudieron traer los datos: ' + textoError(e)); }
}
function renderUser() {
  const el = $('#sb-user'); if (!el || !yo) return;
  el.innerHTML = `<p class="nav-label">Usuario</p><div class="user-box"><div><b>${esc(yo.nombre)}</b><span>${esc(ROLES[yo.rol].nombre)}</span></div><button class="btn btn-sm sb-out" data-act="salir">Salir</button></div>`;
}
function arrancar() {
  cerrarPuerta();
  renderUser();
  const h = location.hash.slice(1);
  state.view = VIEWS[h] && allowed(h) ? h : ROLES[state.role].inicio;
  render();
  suscribir();
  if (cambiosLocales().length) subir(); else estado('ok');
  if (arrancado) return;
  arrancado = true;
  tick(); setInterval(tick, 20000);
  setInterval(() => { if (hayCambiosRemotos && puedeRedibujar()) { hayCambiosRemotos = false; refresh(); } }, 1500);
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== state.view) go(v); });
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('online', () => subir());
  let oculto = 0;
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { oculto = Date.now(); saveNow(); return; }
    if (oculto && Date.now() - oculto > 3 * 60e3) recargar(); else subir();
  });
}

ACT.salir = async () => {
  const n = cambiosLocales().length;
  if (n && !(await confirmar({ title: 'Salir', text: `Hay ${n} cambios que todavía no se subieron (no hay internet). Quedan guardados en este equipo y se suben la próxima vez que alguien entre acá.`, ok: 'Salir igual' }))) return;
  guardarPendientes();
  try { await sb.auth.signOut(); } catch (e) { }
  location.hash = ''; location.reload();
};

/* ---------- Usuarios (Configuración, solo el dueño) ---------- */
async function cargarUsuarios() {
  const box = $('#cfg-users'); if (!box) return;
  const { data, error } = await sb.from('perfiles').select('*').order('creado');
  if (!$('#cfg-users')) return;
  if (error) { box.innerHTML = `<p class="muted">No se pudieron traer los usuarios: ${esc(textoError(error))}</p>`; return; }
  box.innerHTML = data.map(u => {
    const soyYo = u.user_id === yo.id;
    return `<div class="user-row" data-uid="${esc(u.user_id)}">
      <div class="field"><label>Nombre</label><input class="u-nom" value="${esc(u.nombre)}" autocomplete="off"><span class="hint">${esc(u.email || '')}</span></div>
      <div class="field"><label>Permiso</label><select class="u-rol"${soyYo ? ' disabled title="No te podés sacar el permiso de dueño"' : ''}><option value="">Sin acceso</option>${Object.entries(ROLES).map(([k, r]) => `<option value="${k}"${u.rol === k ? ' selected' : ''}>${r.nombre}</option>`).join('')}</select></div>
      <button class="btn btn-sm" data-act="user-save">Guardar</button></div>`;
  }).join('') || '<p class="muted">Todavía no hay usuarios.</p>';
}
ACT['user-save'] = async el => {
  const row = el.closest('.user-row'), uid = row.dataset.uid;
  const nombre = row.querySelector('.u-nom').value.trim(), sel = row.querySelector('.u-rol');
  if (!nombre) { toast('Escribí el nombre', 'warn'); return; }
  const patch = { nombre }; if (!sel.disabled) patch.rol = sel.value || null;
  el.disabled = true;
  const { error } = await sb.from('perfiles').update(patch).eq('user_id', uid);
  el.disabled = false;
  if (error) { toast('No se pudo guardar: ' + textoError(error), 'bad'); return; }
  toast('Usuario guardado');
  if (uid === yo.id) { yo.nombre = nombre; renderUser(); }
};
ACT['conn-cambiar'] = async () => {
  if (!(await confirmar({ title: 'Cambiar la conexión', text: 'Se cierra la sesión en este equipo y se vuelve a pedir la dirección y la clave de Supabase.', ok: 'Cambiar' }))) return;
  guardarPendientes();
  try { await sb.auth.signOut(); } catch (e) { }
  try { localStorage.removeItem(CONN_KEY); } catch (e) { }
  location.hash = ''; location.reload();
};

/* ================= Arranque ================= */
async function init() {
  loadUI();
  if (!window.supabase || !window.supabase.createClient) { puerta('error', 'No se pudo cargar el sistema. Revisá que haya internet y recargá la página.'); return; }
  const c = conexion();
  if (!c) { puerta('conexion'); return; }
  sb = window.supabase.createClient(c.url, c.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'palmares-sesion' } });
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && arrancado) setTimeout(() => puerta('login', 'Tu sesión se cerró. Entrá de nuevo.'), 0); });
  puerta('cargando');
  try {
    const { data } = await sb.auth.getSession();
    if (!data || !data.session) { puerta('login'); return; }
    await entrar(data.session);
  } catch (e) { puerta('error', 'No se pudo conectar: ' + textoError(e)); }
}
init();

</script>
